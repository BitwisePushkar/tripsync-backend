[project]
name = "tripsync-backend"
version = "0.1.0"
description = "backend for tripsync"
authors = [
    { name = "Pushkar Singhal", email = "pusinghal010@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "django>=6.0.3,<7.0.0",
    "python-decouple>=3.8,<4.0",
    "gunicorn>=22.0.0",
    "djangorestframework>=3.17.1,<4.0.0",
    "djangorestframework-simplejwt>=5.5.1,<6.0.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "drf-spectacular>=0.29.0,<0.30.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
    "redis>=5.0.0,<8.0.0",
    "django-redis>=6.0.0,<7.0.0",
    "celery>=5.6.3,<6.0.0",
    "google-auth>=2.49.2",
    "requests>=2.33.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main"]
